      scrub: (e) => this.setState({ ['hi_' + r]: Math.max(0, Math.min(rg.n - 1, Math.round(Number(e.target.value)))) }) };
    hc.aria = hc.stamp;
    const ranges = seg(r, 'r', [['h', '1 giờ'], ['d', '24 giờ'], ['w', '7 ngày']]).map((o, k) => Object.assign(o, { pick: () => this.setState({ r: ['h', 'd', 'w'][k], z_hc: 1, f_hc: 0 }) }));
    const g = s.g || 'a';
    const D = {
      a: [['SOC', '76 %'], ['SOH', '98 %'], ['Số chu kỳ sạc/xả', '312 lần'], ['Điện áp pack (inverter đo)', '51,2 V'], ['Điện áp pack (BMS báo)', '51,0 V'], ['Dòng pack (BMS báo)', '+21,5 A'], ['Nhiệt độ pin (BMS báo)', '29 °C'], ['Nhiệt độ pin (inverter đo)', '30 °C']],
      b: [['Điện áp giới hạn sạc', '56,8 V'], ['Dòng giới hạn sạc', '100 A'], ['Dòng giới hạn xả', '100 A'], ['Công suất sạc cho phép', '5.100 W'], ['Công suất xả cho phép', '5.100 W'], ['Chế độ giới hạn dòng', '1 · Theo BMS']],
      c: [['Điện áp cell cao nhất', '3.352 mV · cell 7'], ['Điện áp cell thấp nhất', '3.340 mV · cell 12'], ['Chênh áp cell', '12 mV'], ['Nhiệt độ cell cao nhất', '31 °C'], ['Nhiệt độ cell thấp nhất', '28 °C']],
      d: [['Số pack đang trực tuyến', '1'], ['Số pack bị cấm sạc', '0'], ['Số pack bị cấm xả', '0'], ['Số pack mất kết nối', '0'], ['Bảng lỗi hệ thống BMS', 'Không có']],
      e: [['Hãng sản xuất BMS', '[TÊN HÃNG]'], ['Phiên bản phần mềm BMS', '2.14'], ['Phiên bản phần cứng BMS', '1.3'], ['Phiên bản giao thức', '2.11']]
    };
    // Cờ BMS (BatteryDataScreen.kt FlagsCard, BO_SUNG_v3 §13): 32 cảnh báo + 32 bảo vệ; bảo vệ xếp trước.
    const KIND = { protect: 'Bảo vệ', alarm: 'Cảnh báo' };
    const FL = [];
    ['alarm', 'protect'].forEach((k) => { for (let b = 0; b < 32; b++) FL.push({ kind: k, bit: b, active: k === 'alarm' && b === 3, name: k === 'alarm' && b === 3 ? 'Nhiệt độ sạc cao' : null }); });
    const fname = (f) => f.name || (f.kind === 'protect' ? 'Cờ bảo vệ bit ' + f.bit : 'Cờ cảnh báo bit ' + f.bit);
    const tone = (k) => k === 'protect' ? ['#3a1513', '#ff7a70'] : ['#33280a', '#e0b341'];
    const chipS = (k) => 'display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 6px; background: ' + tone(k)[0] + '; color: ' + tone(k)[1] + '; font-size: 12px; line-height: 16px; font-weight: 600; white-space: nowrap; flex-shrink: 0';
    const dotS = (k) => 'width: 6px; height: 6px; border-radius: 999px; background: ' + tone(k)[1];
    const act = FL.filter((f) => f.active).sort((x, y) => (x.kind === 'protect' ? 0 : 1) - (y.kind === 'protect' ? 0 : 1));
    const showAll = !!s.all;
    const fl = { title: 'Cờ đang bật (' + act.length + ')', showAll, expanded: showAll ? 'true' : 'false',
      active: act.map((f) => ({ label: KIND[f.kind] + ' · ' + fname(f), style: chipS(f.kind), dot: dotS(f.kind) })),
      none: ['alarm', 'protect'].filter((k) => !act.some((f) => f.kind === k)).map((k) => ({ text: KIND[k] + ': không có cờ nào đang bật.' })),
      btn: showAll ? 'Thu gọn' : 'Xem tất cả trạng thái (' + FL.length + ' cờ)', toggle: () => this.setState({ all: !showAll }),
      sections: ['alarm', 'protect'].map((k) => { const of = FL.filter((f) => f.kind === k);
        return { title: KIND[k] + ' (' + of.length + ')', items: of.map((f, i) => ({ name: fname(f), v: f.active ? 'Bật' : 'Tắt',
          rowStyle: 'height: 36px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; ' + (i ? '' : ''),
          vStyle: f.active ? chipS(k) : 'font-size: 13px; line-height: 20px; color: #9fada6',
          dot: f.active ? dotS(k) : 'display: none' })) }; }) };
    return { hc, zh, chips, ranges, fl, groups: seg(g, 'g', [['a', 'Tổng quan'], ['b', 'Giới hạn'], ['c', 'Cell'], ['d', 'Bảo vệ'], ['e', 'Phiên bản']], 11),
      rows_a: mk(D.a), rows_b: mk(D.b), rows_c: mk(D.c), rows_d: mk(D.d), rows_e: mk(D.e) };
  }
}
</script>
