<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const item = (k, value, name) => {
      const done = s.copied === k;
      return { value, done, idle: !done, aria: done ? 'Đã sao chép ' + name : 'Sao chép ' + name,
        copy: () => { try { navigator.clipboard && navigator.clipboard.writeText(value).catch(() => {}); } catch (e) {} this.setState({ copied: k }); clearTimeout(this._copiedTimer); this._copiedTimer = setTimeout(() => this.setState({ copied: null }), 2000); },
        btn: 'width: 44px; height: 44px; margin: 2px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: none; border-radius: 999px; cursor: pointer; ' + (done ? 'background: #12301f; color: #34c26f' : 'background: transparent; color: #9fada6') };
    };
    return {
      phone: item('phone', '1900 6868', 'số hotline'),
      email: item('email', 'support@ggpower.vn', 'email'),
      toast: s.copied === 'phone' ? 'Đã sao chép số hotline' : s.copied === 'email' ? 'Đã sao chép email' : ''
    };
  }
}
</script>
