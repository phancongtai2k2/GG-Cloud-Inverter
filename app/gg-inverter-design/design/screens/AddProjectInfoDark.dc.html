<!doctype html>
<html lang="vi" style="color-scheme: dark">
<head>
<meta charset="utf-8">
<title>Thêm dự án mới</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&amp;display=swap">
<style>
html,body{scrollbar-width:none}html::-webkit-scrollbar,body::-webkit-scrollbar,*::-webkit-scrollbar{display:none;width:0;height:0}
body{margin:0;font-family:Montserrat,system-ui,-apple-system,"Segoe UI",sans-serif;background:#0c1612;color:#eef3ef}
a{color:#34c26f}a:hover{color:#5bd68c}
a:focus-visible,button:focus-visible,input:focus-visible{outline:none;box-shadow:0 0 0 2px #0c1612,0 0 0 4px #34c26f}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; display: flex; flex-direction: column; background: #0c1612; color: #eef3ef; font-family: Montserrat, system-ui, sans-serif; overflow: hidden">
<header style="height: 64px; flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 0 8px 0 4px"><a href="AddProjectDark.dc.html" aria-label="Quay lại" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 999px; color: #eef3ef; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a><h1 style="margin: 0; flex-grow: 1; font-size: 22px; line-height: 28px; font-weight: 600">Thêm dự án mới</h1></header>
<main style="flex-grow: 1; display: flex; flex-direction: column; gap: 16px; padding: 8px 20px 24px; overflow: hidden; gap: 14px">
<div style="display: flex; align-items: center; gap: 8px"><div style="flex: 1 1 0; display: flex; flex-direction: column; gap: 6px"><span style="height: 4px; border-radius: 999px; background: #178a47"></span><span style="font-size: 11px; line-height: 14px; font-weight: 600; color: #9fada6">1. Thiết bị</span></div><div style="flex: 1 1 0; display: flex; flex-direction: column; gap: 6px"><span style="height: 4px; border-radius: 999px; background: #178a47"></span><span style="font-size: 11px; line-height: 14px; font-weight: 600; color: #9fada6">2. Thông tin dự án</span></div><div style="flex: 1 1 0; display: flex; flex-direction: column; gap: 6px"><span style="height: 4px; border-radius: 999px; background: #26352f"></span><span style="font-size: 11px; line-height: 14px; font-weight: 600; color: #9fada6">3. Giá điện</span></div></div>

<div style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 6px"><label for="ap-name" style="font-size: 13px; line-height: 16px; font-weight: 600">Tên dự án *</label><input id="ap-name" type="text" value="Nhà của bạn" style="height: 48px; box-sizing: border-box; width: 100%; padding: 0 14px; border: 1px solid #6b7a73; border-radius: 10px; background: #1c2b25; font-family: inherit; font-size: 14px; color: #eef3ef"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; line-height: 16px; font-weight: 600">Loại công trình *</span><div role="group" aria-label="Loại công trình" style="display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: #0e1814"><sc-for list="{{kinds}}" as="o" hint-placeholder-count="3"><button type="button" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="{{o.style}}">{{o.label}}</button></sc-for></div></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="ap-addr" style="font-size: 13px; line-height: 16px; font-weight: 600">Địa chỉ *</label><div style="display: flex; gap: 8px"><input id="ap-addr" type="text" value="Xuân Quan, Văn Giang, Hưng Yên" style="height: 48px; box-sizing: border-box; width: 100%; padding: 0 14px; border: 1px solid #6b7a73; border-radius: 10px; background: #1c2b25; font-family: inherit; font-size: 14px; color: #eef3ef; flex-grow: 1; min-width: 0"><button type="button" aria-label="Lấy vị trí hiện tại" style="width: 48px; height: 48px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: 1px solid #6b7a73; border-radius: 10px; background: #1c2b25; color: #34c26f; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="12" r="3.5"></circle><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"></path></svg></button></div><span style="font-size: 12px; line-height: 16px; color: #9fada6">Toạ độ dùng để tra cứu thời tiết và bức xạ</span></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; line-height: 16px; font-weight: 600">Múi giờ *</span><button type="button" style="height: 48px; box-sizing: border-box; width: 100%; padding: 0 14px; border: 1px solid #6b7a73; border-radius: 10px; background: #1c2b25; font-family: inherit; font-size: 14px; color: #eef3ef; display: flex; align-items: center; justify-content: space-between; text-align: left; cursor: pointer; font-size: 13px">Asia/Ho_Chi_Minh<span style="display: flex; color: #9fada6"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M6 9l6 6 6-6"></path></svg></span></button></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="ap-date" style="font-size: 13px; line-height: 16px; font-weight: 600">Ngày lắp đặt *</label><input id="ap-date" type="text" value="26/09/2026" style="height: 48px; box-sizing: border-box; width: 100%; padding: 0 14px; border: 1px solid #6b7a73; border-radius: 10px; background: #1c2b25; font-family: inherit; font-size: 14px; color: #eef3ef"></div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="ap-kwp" style="font-size: 13px; line-height: 16px; font-weight: 600">Công suất PV lắp đặt (kWp) *</label><input id="ap-kwp" type="text" value="6,5" inputmode="decimal" style="height: 48px; box-sizing: border-box; width: 100%; padding: 0 14px; border: 1px solid #6b7a73; border-radius: 10px; background: #1c2b25; font-family: inherit; font-size: 14px; color: #eef3ef"><span style="font-size: 12px; line-height: 16px; color: #9fada6">Dùng để tính hệ số hiệu quả trên biểu đồ Sản lượng PV</span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; line-height: 16px; font-weight: 600">Ảnh công trình</span><button type="button" style="height: 72px; display: flex; align-items: center; justify-content: center; gap: 8px; border: 1px dashed #6b7a73; border-radius: 10px; background: transparent; color: #eef3ef; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><rect x="3.5" y="4.5" width="17" height="15" rx="2"></rect><circle cx="9" cy="10" r="1.8"></circle><path d="M20.5 16l-5-5-8 8.5"></path></svg>Thêm ảnh (không bắt buộc)</button></div>
<div style="display: flex; gap: 10px; padding-top: 4px"><a href="AddProjectDark.dc.html" style="height: 52px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid #6b7a73; border-radius: 10px; background: #1c2b25; color: #eef3ef; font-family: inherit; font-size: 15px; font-weight: 600; text-decoration: none; cursor: pointer; flex: 1 1 0">Quay lại</a><a href="AddProjectTariffDark.dc.html" style="height: 52px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; gap: 8px; border: none; border-radius: 10px; background: #178a47; color: #ffffff; font-family: inherit; font-size: 15px; font-weight: 600; text-decoration: none; cursor: pointer; flex: 2 1 0">Tiếp tục</a></div>
</div>

</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    const seg = (cur, key, list, fs) => list.map(([id, label]) => { const on = id === cur;
      return { label, pressed: on ? 'true' : 'false', pick: () => this.setState({ [key]: id }),
        style: 'flex: 1 1 0; min-width: 0; height: 36px; padding: 0 4px; border: none; border-radius: 10px; font-family: inherit; font-size: ' + (fs || 13) + 'px; font-weight: 600; white-space: nowrap; cursor: pointer; ' + (on ? 'background: #1c2b25; color: #eef3ef; box-shadow: 0 1px 2px rgba(0,0,0,0.22), 0 2px 8px rgba(0,0,0,0.18)' : 'background: transparent; color: #9fada6') }; });
    const s = this.state || {};
    const step = s.step || 1;
    const bar = (i) => 'height: 4px; border-radius: 999px; background: ' + (i <= step ? '#178a47' : '#26352f');
    const st1 = bar(1);
    const st2 = bar(2);
    const st3 = bar(3);
    const checked = s.checked == null ? true : s.checked;
    return { st1, st2, st3, s1: step === 1, s2: step === 2, s3: step === 3, checked,
      check: () => this.setState({ checked: true }),
      nextStyle: 'flex: 1 1 0; height: 52px; border: none; border-radius: 10px; font-family: inherit; font-size: 15px; font-weight: 600; ' + (checked ? 'background: #178a47; color: #ffffff; cursor: pointer' : 'background: #26352f; color: #9fada6; cursor: not-allowed'),
      go1: () => this.setState({ step: 1 }), go2: () => { if (checked) this.setState({ step: 2 }); }, go3: () => this.setState({ step: 3 }),
      kinds: seg(s.kind || 'home', 'kind', [['home', 'Nhà ở'], ['factory', 'Nhà xưởng']]),
      tariffs: seg(s.tariff || 'tier', 'tariff', [['tier', 'Bậc thang EVN'], ['fixed', 'Giá cố định']]),
      isTier: (s.tariff || 'tier') === 'tier', isFixed: s.tariff === 'fixed' };
  }
}

</script>
</body>
</html>
