<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Thông tin tài khoản</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&amp;display=swap">
<style>
html,body{scrollbar-width:none}html::-webkit-scrollbar,body::-webkit-scrollbar,*::-webkit-scrollbar{display:none;width:0;height:0}
body{margin:0;font-family:Montserrat,system-ui,-apple-system,"Segoe UI",sans-serif;background:#f5f7f3;color:#13201b}
a{color:#0f7a3a}a:hover{color:#0b6630}
a:focus-visible,button:focus-visible,input:focus-visible{outline:none;box-shadow:0 0 0 2px #ffffff,0 0 0 4px #0f7a3a}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; display: flex; flex-direction: column; background: #f5f7f3; color: #13201b; font-family: Montserrat, system-ui, sans-serif; overflow: hidden">
<header style="height: 64px; flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 0 8px 0 4px"><a href="Me.dc.html" aria-label="Quay lại" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 999px; color: #13201b; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a><h1 style="margin: 0; flex-grow: 1; font-size: 22px; line-height: 28px; font-weight: 600">Thông tin tài khoản</h1></header>
<main style="flex-grow: 1; display: grid; grid-template-columns: minmax(0, 1fr); grid-auto-rows: max-content; align-content: start; gap: 12px; padding: 0 20px 16px; overflow: hidden">
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px 0"><button type="button" aria-label="Đổi ảnh đại diện" style="position: relative; width: 88px; height: 88px; border: none; border-radius: 999px; background: #e3f3e8; color: #0f7a3a; font-family: inherit; font-size: 28px; font-weight: 700; cursor: pointer">MD<span style="position: absolute; right: -2px; bottom: -2px; width: 32px; height: 32px; border-radius: 999px; background: #0f7a3a; color: #ffffff; border: 3px solid #f5f7f3; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2l1.5-2h6l1.5 2h2A1.5 1.5 0 0 1 20 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></span></button><span style="font-size: 12px; line-height: 16px; color: #56625c">Chạm để chụp mới hoặc chọn từ thư viện</span></div>
<section style="background: #f9faf7; border: 1px solid #e3e8e1; border-radius: 16px; box-shadow: 0 1px 2px rgba(19,32,27,0.06), 0 2px 8px rgba(19,32,27,0.05); padding: 12px 16px"><div style="display: flex; flex-direction: column; gap: 6px"><label for="ac-name" style="font-size: 13px; line-height: 16px; font-weight: 600">Họ và tên</label><input id="ac-name" type="text" value="Michael Demo" onInput="{{markDirty}}" style="height: 48px; box-sizing: border-box; width: 100%; padding: 0 14px; border: 1px solid #7f8b85; border-radius: 10px; background: #ffffff; font-family: inherit; font-size: 14px; color: #13201b"></div></section>
<section style="background: #f9faf7; border: 1px solid #e3e8e1; border-radius: 16px; box-shadow: 0 1px 2px rgba(19,32,27,0.06), 0 2px 8px rgba(19,32,27,0.05); overflow: hidden">
<a href="#" style="min-height: 56px; display: flex; align-items: center; gap: 12px; padding: 6px 16px; box-sizing: border-box; text-decoration: none; color: #13201b"><span style="color: #56625c; display: flex"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><rect x="3" y="5.5" width="18" height="13" rx="2"></rect><path d="M3.5 7l8.5 6 8.5-6"></path></svg></span><span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; line-height: 16px; color: #56625c">Email · đổi cần xác thực OTP</span><span style="font-size: 14px; line-height: 20px; font-weight: 600">demo@ggp.vn</span></span><span style="color: #56625c; display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M9 6l6 6-6 6"></path></svg></span></a>
<a href="#" style="border-top: 1px solid #e3e8e1; min-height: 56px; display: flex; align-items: center; gap: 12px; padding: 6px 16px; box-sizing: border-box; text-decoration: none; color: #13201b"><span style="color: #56625c; display: flex"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M5 4h3.5l1.5 4-2 1.5a10 10 0 0 0 6.5 6.5l1.5-2 4 1.5V19a1.5 1.5 0 0 1-1.5 1.5A16 16 0 0 1 3.5 5.5 1.5 1.5 0 0 1 5 4z"></path></svg></span><span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; line-height: 16px; color: #56625c">Số điện thoại · đổi cần xác thực OTP</span><span style="font-size: 14px; line-height: 20px; font-weight: 600">0912 345 678</span></span><span style="color: #56625c; display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M9 6l6 6-6 6"></path></svg></span></a>
<a href="#" style="border-top: 1px solid #e3e8e1; min-height: 56px; display: flex; align-items: center; gap: 12px; padding: 6px 16px; box-sizing: border-box; text-decoration: none; color: #13201b"><span style="color: #56625c; display: flex"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><rect x="5" y="10.5" width="14" height="10" rx="2"></rect><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"></path></svg></span><span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; line-height: 16px; color: #56625c">Bảo mật</span><span style="font-size: 14px; line-height: 20px; font-weight: 600">Đổi mật khẩu</span></span><span style="color: #56625c; display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M9 6l6 6-6 6"></path></svg></span></a>

</section>
<button type="button" onClick="{{askDelete}}" style="height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px; border: none; background: transparent; color: #c62828; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13"></path></svg>Xoá tài khoản</button>
</main>
<div style="flex-shrink: 0; padding: 12px 20px 24px; border-top: 1px solid #e3e8e1; background: #f5f7f3"><button type="button" aria-disabled="{{saveAria}}" style="{{saveStyle}}">Lưu thay đổi</button></div>
<sc-if value="{{confirm}}" hint-placeholder-val="{{false}}"><div style="position: absolute; inset: 0; background: rgba(14,21,18,0.55); display: flex; align-items: center; padding: 20px"><div role="dialog" aria-modal="true" aria-labelledby="del-t" style="flex-grow: 1; background: #ffffff; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
<h2 id="del-t" style="margin: 0; font-size: 18px; line-height: 26px; font-weight: 700">Xoá tài khoản?</h2>
<p style="margin: 0; font-size: 13px; line-height: 20px; color: #56625c">Tài khoản bị khoá đăng nhập ngay. Toàn bộ dữ liệu và dự án sẽ bị xoá vĩnh viễn sau 30 ngày.</p>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="del-pw" style="font-size: 13px; line-height: 16px; font-weight: 600">Nhập mật khẩu để xác nhận</label><div style="position: relative; display: flex"><input id="del-pw" type="password" value="" style="height: 48px; box-sizing: border-box; width: 100%; padding: 0 14px; border: 1px solid #7f8b85; border-radius: 10px; background: #ffffff; font-family: inherit; font-size: 14px; color: #13201b; padding-right: 52px"><button type="button" aria-label="Hiện mật khẩu" style="position: absolute; right: 2px; top: 0; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border: none; background: transparent; color: #56625c; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button></div></div>
<div style="display: flex; gap: 10px"><button type="button" onClick="{{cancelDelete}}" style="height: 52px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid #7f8b85; border-radius: 10px; background: #ffffff; color: #13201b; font-family: inherit; font-size: 15px; font-weight: 600; text-decoration: none; cursor: pointer; flex: 1 1 0; height: 48px">Huỷ</button><button type="button" style="height: 52px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; gap: 8px; border: none; border-radius: 10px; background: #0f7a3a; color: #ffffff; font-family: inherit; font-size: 15px; font-weight: 600; text-decoration: none; cursor: pointer; flex: 1 1 0; height: 48px; background: #c62828">Xoá tài khoản</button></div>
</div></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const dirty = !!s.dirty;
    return { confirm: !!s.confirm, askDelete: () => this.setState({ confirm: true }), cancelDelete: () => this.setState({ confirm: false }),
      markDirty: () => { if (!dirty) this.setState({ dirty: true }); }, saveAria: dirty ? 'false' : 'true',
      saveStyle: 'width: 100%; height: 52px; border: none; border-radius: 10px; font-family: inherit; font-size: 15px; font-weight: 600; ' + (dirty ? 'background: #0f7a3a; color: #ffffff; cursor: pointer' : 'background: #d9dfd8; color: #56625c; cursor: not-allowed') };
  }
}
</script>
</body>
</html>
