# Broker for local load tests only (no authentication): docker run ... -v <this file>:/mosquitto/config/mosquitto.conf
listener 1883
allow_anonymous true
max_queued_messages 800000
queue_qos0_messages true
persistent_client_expiration 1d
max_inflight_messages 1000
persistence false
log_dest stdout
log_type error
log_type warning
