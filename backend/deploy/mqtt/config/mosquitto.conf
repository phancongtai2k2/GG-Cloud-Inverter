# GG Power MQTT broker. Every client must log in; what it may do is in the acl file.
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
max_packet_size 65536

# Backend persistent session (plan A5): while the backend is down the broker keeps its messages, up to ~10 min
# at 5.000 devices (5.000 × 0,25 msg/s × 600 s ≈ 750.000). Dataloggers may publish QoS 0: queue those too.
max_queued_messages 800000
queue_qos0_messages true
# Sessions of clients gone for a day are dropped (keeps a decommissioned backend from holding a queue forever).
persistent_client_expiration 1d

# Inside the Docker network only (not published): the backend connects here.
listener 1883

# Public, TLS only: dataloggers connect here. The certificate is the web server's, copied by mqtt-cert-sync.sh.
listener 8883
certfile /mosquitto/certs/fullchain.crt
keyfile /mosquitto/certs/privkey.key
tls_version tlsv1.2

# Applies to the public listener above (it must stay below that listener line: placed before the
# listeners it makes the broker open a second, implicit listener on 1883 and fail with "Address in use").
# The account name becomes the client id, so two dataloggers left on the same default client id cannot
# disconnect each other, and one account cannot take over another's session.
use_username_as_clientid true
