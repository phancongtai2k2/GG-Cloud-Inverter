# GG Power server: database + MQTT broker + API + web front (TLS, static site). Everything lives in this folder.
#   docker compose up -d --build     start / update
#   docker compose logs -f api       follow the API log
# Published: web (80/443) and the MQTT broker's TLS port (8883). The database is reachable from the API only.
name: ggpower

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ggpower
      POSTGRES_DB: ggpower
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ggpower -d ggpower"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  mqtt:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "8883:8883"          # TLS, for dataloggers. 1883 stays inside the Docker network.
    volumes:
      - ./mqtt/config:/mosquitto/config
      - ./mqtt/certs:/mosquitto/certs:ro
      - ./data/mosquitto:/mosquitto/data
    networks: [internal]

  api:
    # Long enough for the backend to write its queued samples on stop (docker default: 10 s, then SIGKILL).
    stop_grace_period: 30s
    build: ./backend
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      mqtt: { condition: service_started }
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      GGP_ConnectionStrings__Main: "Host=db;Port=5432;Database=ggpower;Username=ggpower;Password=${POSTGRES_PASSWORD};Maximum Pool Size=40"
      GGP_Security__JwtSigningKey: ${JWT_SIGNING_KEY:?set in .env}
      GGP_Security__LogOtpCodes: ${LOG_OTP_CODES:-false}
      GGP_Mqtt__Host: ${MQTT_HOST}
      GGP_Mqtt__Port: ${MQTT_PORT:-1883}
      GGP_Mqtt__UseTls: ${MQTT_TLS:-false}
      GGP_Mqtt__Username: ${MQTT_USER}
      GGP_Mqtt__Password: ${MQTT_PASSWORD}
      GGP_Ingest__Tenants__0: ${MQTT_TENANT:-ggp}
      GGP_Storage__Root: /data/storage
      # Client addresses are taken from X-Forwarded-For of the web container only.
      GGP_Proxy__Known__0: 172.28.0.250
    volumes:
      - ./data/storage:/data/storage
    networks: [internal]

  # ----- Several API instances (plan B, profile "multi": docker compose --profile multi up -d). Not started otherwise. -----

  # Shared state of the API instances (tickets, command locks, realtime frames): Shared__Provider=redis.
  redis:
    image: redis:7-alpine
    profiles: [multi]
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]   # nothing in it needs to survive a restart
    networks: [internal]

  # Uploaded files readable from every instance (S3, SeaweedFS): Storage__Provider=s3. Data in ./data/files.
  files:
    image: chrislusf/seaweedfs:3.80
    profiles: [multi]
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-ggpower}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
    # One identity from .env; anonymous requests are refused.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        [ -n "$$S3_SECRET_KEY" ] || { echo "S3_SECRET_KEY is not set in .env" >&2; exit 1; };
        printf '{"identities":[{"name":"ggpower","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        && exec weed server -s3 -dir=/data -s3.config=/tmp/s3.json
    volumes:
      - ./data/files:/data
    networks: [internal]

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [api]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./www:/srv/www:ro
      - ./data/caddy:/data
    networks:
      internal: { ipv4_address: 172.28.0.250 }

networks:
  internal:
    ipam:
      config:
        - subnet: 172.28.0.0/24
